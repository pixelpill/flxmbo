<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Select Device</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="device2.js"></script>
</head>
<body>

  <div class="animated-bg"></div>

  <div class="device-container">
    <h1>Choose Your Device</h1>

    <div class="device-buttons">
      <button class="device-btn" id="mobileBtn">
        <img src="images/IMG_0196.jpeg" alt="Mobile">
        <span>Mobile</span>
      </button>

      <button class="device-btn" id="pcBtn">
        <img src="images/IMG_0193.jpeg" alt="PC">
        <span>PC</span>
      </button>
    </div>
  </div>

</body>
</html>
