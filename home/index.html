<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta-name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Games</title>

  <!-- Correct CSS path -->
  <link rel="stylesheet" href="style.css">

  <!-- Load home.js FIRST so it can set up UI -->
  <script defer src="home.js"></script>

  <!-- Load games.js AFTER so it can render games -->
  <script defer src="games.js"></script>
</head>
<body>

  <!-- ⭐ TOP-LEFT LOGO (same size as device selection) ⭐ -->
  <div class="site-brand">
    <img src="../images/flumbo.png" alt="Logo">
    <span>flxmbo</span>
  </div>

  <div class="background"></div>

  <nav class="navbar">
    <!-- ⭐ CENTERED TITLE ⭐ -->
    <h1 class="logo center-title">Games</h1>

    <button id="themeBtn">Themes</button>
  </nav>

  <div class="search-container">
    <input type="text" id="searchInput" placeholder="Search games...">
  </div>

  <div class="categories">
    <button class="cat-btn" data-category="all">All</button>
    <button class="cat-btn" data-category="action">Action</button>
    <button class="cat-btn" data-category="horror">Horror</button>
    <button class="cat-btn" data-category="racing">Racing</button>
    <button class="cat-btn" data-category="strategy">Strategy</button>
  </div>

  <section class="games-grid" id="gamesGrid"></section>

  <!-- ⭐ FULLSCREEN THEME PAGE ⭐ -->
  <div id="themePage" class="theme-page">
    <div class="theme-page-content">

      <h1 class="theme-title">Select Theme</h1>

      <div class="theme-buttons">
        <button class="theme-big-btn" data-theme="default">Default</button>
        <button class="theme-big-btn" data-theme="neon">Neon</button>
        <button class="theme-big-btn" data-theme="horror">Horror</button>
        <button class="theme-big-btn" data-theme="vaporwave">Vaporwave</button>
      </div>

      <button id="backBtn" class="back-btn">Back</button>

    </div>
  </div>
  <!-- ⭐ END FULLSCREEN THEME PAGE ⭐ -->

</body>
</html>
